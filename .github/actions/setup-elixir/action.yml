# The setup of each Elixir job of `.github/workflows/check.yml`: Erlang and
# Elixir of `.tool-versions`, the cache of the dependencies and of the build,
# and `mix deps.get`.
#
# Each job gives its own name to the cache. A job that compiles nothing, such
# as the formatter, then does not save a cache with no build for the other jobs.
#
# On main, the key holds the commit. Each run on main thus saves the build of
# its commit, and the next run compiles only the files that changed after it.
# For a pull request, the key holds the word `pull-request` in place of the
# commit. The first run of the pull request saves a cache, and the next runs
# read it and save no new cache. Thus a pull request with many commits does
# not fill the storage of the caches. A run with no exact cache reads the
# latest cache of the same `mix.lock`, and then the latest cache of the job.

name: Set up Elixir
description: Install Erlang and Elixir, read the cache, and get the dependencies.

inputs:
  cache:
    description: The name of the cache of the job.
    required: true

runs:
  using: composite
  steps:
    - name: Install Erlang and Elixir
      uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ env.OTP_VERSION }}
        elixir-version: ${{ env.ELIXIR_VERSION }}

    # `mix.exs` puts the PLT of Dialyzer in `priv/plts`, and not in `_build`.
    # Without `priv/plts` in the cache, each run of Dialyzer builds the PLT
    # again, and that takes some minutes.
    - name: Read the cache of the dependencies and of the build
      uses: actions/cache@v6
      with:
        path: |
          deps
          _build
          priv/plts
        key: mix-${{ inputs.cache }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}-${{ github.event_name == 'push' && github.sha || 'pull-request' }}
        restore-keys: |
          mix-${{ inputs.cache }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}-
          mix-${{ inputs.cache }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

    - name: Get the dependencies
      shell: bash
      run: mix deps.get
